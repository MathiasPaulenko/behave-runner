[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "behave-runner"
version = "0.1.0"
description = "CLI completa para Behave con subcomandos — punto de entrada unificado del ecosistema BehaveLib"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["behave", "bdd", "cli", "runner", "watch", "impact-analysis", "test-runner"]
authors = [
    { name = "Mathias Paulenko", email = "mathias.paulenko@outlook.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "behave>=1.2.6",
    "behave-kit>=0.1.0",
]

[project.optional-dependencies]
parallel = ["behave-pool>=0.1.0"]
priority = ["behave-priority>=0.1.0"]
trace = ["behave-trace>=0.1.0"]
all = [
    "behave-pool>=0.1.0",
    "behave-priority>=0.1.0",
    "behave-trace>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/MathiasPaulenko/behave-runner"
Repository = "https://github.com/MathiasPaulenko/behave-runner"
Issues = "https://github.com/MathiasPaulenko/behave-runner/issues"
Changelog = "https://github.com/MathiasPaulenko/behave-runner/blob/main/CHANGES.md"

[project.scripts]
behave-runner = "behave_runner.cli:main"

[tool.hatch.version]
path = "behave_runner/__init__.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=behave_runner --cov-report=term-missing"
